name: Release

# 推送 v* 标签时自动打包 macOS / Windows 安装包，并发布 Release。
# 版本号从标签自动推导（v0.2.0 → 0.2.0），无需手动改代码里的版本号。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只打标签即可发布：把 tag 里的版本号写回三处版本号来源，保证安装包 / 应用内更新一致
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "标签格式应为 vX.Y.Z，当前为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "Release version: $VERSION"

          # package.json 与 tauri.conf.json：写顶层 version
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const obj = JSON.parse(fs.readFileSync(f, "utf8"));
              obj.version = v;
              fs.writeFileSync(f, JSON.stringify(obj, null, 2) + "\n");
            }
          ' "$VERSION"

          # Cargo.toml：只改 [package] 段的 version（rust-version 不受影响）
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const p = "src-tauri/Cargo.toml";
            const s = fs.readFileSync(p, "utf8")
              .replace(/^(version\s*=\s*")[^"]*(")/m, `$1${v}$2`);
            fs.writeFileSync(p, s);
          ' "$VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # 构建失败也保存缓存：否则每次失败都要从零编译一遍
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      # Windows 首次打包会下载 WiX / NSIS 工具（几十 MB），缓存后二次构建可跳过
      - name: Cache Tauri bundler tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-bundler-tools-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      # 密钥缺失时提前失败，避免编译 5 分钟后才在签名环节报错
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "缺少 secrets.TAURI_SIGNING_PRIVATE_KEY，无法签名更新包" >&2
            exit 1
          fi

      - name: Build app and attach bundles to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新：签名更新包并生成 latest.json（私钥只存在于仓库 Secrets，且无密码）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TokenSonar ${{ github.ref_name }}"
          releaseBody: |
            TokenSonar ${{ github.ref_name }}

            ## 安装包
            - macOS：`*.dmg`（仅 Apple Silicon）
            - Windows：`*-setup.exe` / `*.msi`

            ## 应用内更新
            已安装旧版本的用户会在启动或手动「检查更新」时收到提示。

            ## 说明
            安装包未签名：
            - macOS 首次打开若提示「无法验证开发者」，请右键 → 打开，或执行 `xattr -cr /Applications/TokenSonar.app`
            - Windows 若弹出 SmartScreen，请点「更多信息」→「仍要运行」
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 构建完成后把安装包同步到 Cloudflare R2（公共只读分发的镜像）。
  # 认证信息全部来自 GitHub Secrets，不落仓库。
  # 该桶为多应用共用（software），TokenSonar 的产物统一放在 token-sonar/ 前缀下。
  publish-r2:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist

      - name: Check R2 secrets
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            exit 1
          fi
          echo "R2 secrets 已配置"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          R2_BASE: https://dl.panpan.space
          R2_PREFIX: token-sonar
        run: |
          set -euo pipefail

          # 安装包按版本分目录存放：token-sonar/<version>/<文件名>。
          # 文件名本身不带版本号，如果所有版本都放在同一个 key 上，配合下面 immutable
          # 的长缓存，Cloudflare 边缘会一直返回首次缓存的旧安装包，客户端拿旧包去比对
          # latest.json 里的新签名就会报 "The signature verification failed"。
          # 把版本写进路径后，每个版本的 URL 天然唯一，immutable 缓存才是安全的。
          VERSION="${GITHUB_REF_NAME#v}"
          R2_DIR="${R2_PREFIX}/${VERSION}"

          # 1. 把 latest.json 里的下载地址从 GitHub Release 改写到 R2 的版本目录。
          #    signature 是对文件内容签名的，与 url 无关，改写不会破坏更新校验。
          if [ -f dist/latest.json ]; then
            gh_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
            jq --arg p "$gh_prefix" --arg b "${R2_BASE}/${R2_DIR}/" \
              '.platforms |= with_entries(
                 .value.url |= (if startswith($p) then $b + .[($p | length):] else . end)
               )' dist/latest.json > dist/latest.json.tmp
            mv dist/latest.json.tmp dist/latest.json
            cat dist/latest.json
          fi

          # 2. 上传安装包到版本目录。路径里带版本号，内容不会变，可以长缓存。
          for f in dist/*; do
            name="$(basename "$f")"
            [ "$name" = "latest.json" ] && continue
            echo "上传 $R2_DIR/$name"
            aws s3 cp "$f" "s3://$BUCKET/$R2_DIR/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          # 3. 删除其他版本的旧文件（先传后删，避免下载地址 404 窗口）。
          #    只保留本次的版本目录与 latest.json 指针本身。
          existing="$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --prefix "$R2_PREFIX/" \
            --query 'Contents[].Key' \
            --output text \
            --endpoint-url "$R2_ENDPOINT")"
          [ "$existing" = "None" ] && existing=""
          for key in $existing; do
            case "$key" in
              "$R2_DIR/"*) continue ;;
              "$R2_PREFIX/latest.json") continue ;;
            esac
            echo "删除旧文件 $key"
            aws s3 rm "s3://$BUCKET/$key" --endpoint-url "$R2_ENDPOINT"
          done

          # 4. 最后更新指针，保证 latest.json 生效时文件一定已就位。
          if [ -f dist/latest.json ]; then
            aws s3 cp dist/latest.json "s3://$BUCKET/$R2_PREFIX/latest.json" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/json" \
              --cache-control "no-cache"
          else
            echo "latest.json 不存在，跳过指针更新"
          fi
