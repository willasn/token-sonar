name: Release

# 推送 v* 标签时自动打包 macOS / Windows 安装包，并发布 Release。
# 版本号从标签自动推导（v0.2.0 → 0.2.0），无需手动改代码里的版本号。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只打标签即可发布：把 tag 里的版本号写回三处版本号来源，保证安装包 / 应用内更新一致
      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "标签格式应为 vX.Y.Z，当前为 ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "Release version: $VERSION"

          # package.json 与 tauri.conf.json：写顶层 version
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const obj = JSON.parse(fs.readFileSync(f, "utf8"));
              obj.version = v;
              fs.writeFileSync(f, JSON.stringify(obj, null, 2) + "\n");
            }
          ' "$VERSION"

          # Cargo.toml：只改 [package] 段的 version（rust-version 不受影响）
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            const p = "src-tauri/Cargo.toml";
            const s = fs.readFileSync(p, "utf8")
              .replace(/^(version\s*=\s*")[^"]*(")/m, `$1${v}$2`);
            fs.writeFileSync(p, s);
          ' "$VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # 构建失败也保存缓存：否则每次失败都要从零编译一遍
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      # Windows 首次打包会下载 WiX / NSIS 工具（几十 MB），缓存后二次构建可跳过
      - name: Cache Tauri bundler tools (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-bundler-tools-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      # 密钥缺失时提前失败，避免编译 5 分钟后才在签名环节报错
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "缺少 secrets.TAURI_SIGNING_PRIVATE_KEY，无法签名更新包" >&2
            exit 1
          fi

      - name: Build app and attach bundles to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新：签名更新包并生成 latest.json（私钥只存在于仓库 Secrets，且无密码）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TokenSonar ${{ github.ref_name }}"
          releaseBody: |
            TokenSonar ${{ github.ref_name }}

            ## 安装包
            - macOS：`*.dmg`（仅 Apple Silicon）
            - Windows：`*-setup.exe` / `*.msi`

            ## 应用内更新
            已安装旧版本的用户会在启动或手动「检查更新」时收到提示。

            ## 说明
            安装包未签名：
            - macOS 首次打开若提示「无法验证开发者」，请右键 → 打开，或执行 `xattr -cr /Applications/TokenSonar.app`
            - Windows 若弹出 SmartScreen，请点「更多信息」→「仍要运行」
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
